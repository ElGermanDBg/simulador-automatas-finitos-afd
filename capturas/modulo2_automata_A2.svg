    <text x="28" y="88" fill="#38bdf8" font-weight="bold">        MÓDULO 2: CINCO PALABRAS RECONOCIDAS POR EL AFD</text>
    <text x="28" y="108" fill="#38bdf8" font-weight="bold">=================================================================</text>
    <text x="28" y="132" fill="#94a3b8">Autómata en memoria: M = ({s0, s1, s2}, {a, b}, δ, s0, {s2})</text>
    <text x="28" y="154" fill="#94a3b8">Generando y evaluando palabras en orden canónico (longitud 0 a 10)...</text>

    <text x="28" y="186" fill="#4ade80" font-weight="bold">[+] Se encontraron 5 palabras reconocidas en orden canónico:</text>

