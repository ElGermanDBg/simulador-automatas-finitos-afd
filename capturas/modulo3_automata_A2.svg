<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <rect width="880" height="470" rx="12" fill="#0f172a"/>
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#ef4444"/>
  <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="6" fill="#22c55e"/>
  <text x="440" y="23" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">Módulo 3 · Reconocimiento de Palabras y Recorrido Resaltado (Autómata A2)</text>

  <!-- Consola Izquierda con las pruebas de Tabla 2 -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#e2e8f0">
    <text x="22" y="64" fill="#38bdf8" font-weight="bold">=== MÓDULO 3: PROBAR PALABRAS EN EL AFD ===</text>

    <text x="22" y="92" fill="#facc15">&gt; Palabra: "abab"</text>
    <text x="22" y="110">Recorrido: s0 -a→ s1 -b→ s2 -a→ s1 -b→ s2</text>
    <text x="22" y="128">Estado final: s2 (SÍ ∈ F)</text>
    <text x="22" y="146" fill="#4ade80" font-weight="bold">Veredicto: ¡La palabra SÍ es reconocida!</text>

    <text x="22" y="180" fill="#facc15">&gt; Palabra: "aba"</text>
    <text x="22" y="198">Recorrido: s0 -a→ s1 -b→ s2 -a→ s1</text>
    <text x="22" y="216">Estado final: s1 (NO ∉ F)</text>
    <text x="22" y="234" fill="#f87171" font-weight="bold">Veredicto: La palabra NO es reconocida.</text>

    <text x="22" y="268" fill="#facc15">&gt; Palabra: "bab"</text>
    <text x="22" y="286">Recorrido: s0 -b→ s0 -a→ s1 -b→ s2</text>
    <text x="22" y="304">Estado final: s2 (SÍ ∈ F)</text>
    <text x="22" y="322" fill="#4ade80" font-weight="bold">Veredicto: ¡La palabra SÍ es reconocida!</text>

    <text x="22" y="356" fill="#facc15">&gt; Palabra: ε (Enter sin texto)</text>
    <text x="22" y="374">Recorrido: s0 | Estado final: s0 (NO ∉ F)</text>
    <text x="22" y="392" fill="#f87171" font-weight="bold">Veredicto: La palabra NO es reconocida.</text>

    <text x="22" y="424" fill="#facc15">&gt; Palabra: "abc"</text>
    <text x="22" y="442" fill="#f87171">[!] Error: símbolo 'c' (posición 3) ∉ Σ = {a, b}</text>
  </g>

  <!-- Gráfica Derecha: Recorrido Resaltado de "bab" (Figura 3 del PDF) -->
  <rect x="420" y="55" width="436" height="390" rx="10" fill="#ffffff"/>
  <text x="638" y="84" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold">Recorrido de "bab" Resaltado en la Gráfica (Figura 3)</text>
  <text x="638" y="104" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="12">s0 -b→ s0 (Paso 1)  ·  s0 -a→ s1 (Paso 2)  ·  s1 -b→ s2 (Paso 3)</text>

  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-act" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Flecha inicial -->
  <line x1="445" y1="250" x2="486" y2="250" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arr-gray)"/>

  <!-- Paso 1: Bucle s0 con b (RESALTADO) -->
  <path d="M 503 223 C 483 168, 547 168, 527 223" fill="none" stroke="#ea580c" stroke-width="3.2" marker-end="url(#arr-act)"/>
  <text x="505" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#ea580c">b</text>
  <circle cx="527" cy="168" r="10" fill="#ea580c"/>
  <text x="527" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#ffffff">1</text>

  <!-- Paso 2: s0 -> s1 con a (RESALTADO) -->
  <line x1="543" y1="250" x2="612" y2="250" stroke="#ea580c" stroke-width="3.2" marker-end="url(#arr-act)"/>
  <text x="578" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#ea580c">a</text>
  <circle cx="578" cy="268" r="10" fill="#ea580c"/>
  <text x="578" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#ffffff">2</text>

  <!-- Bucle s1 con a (inactivo) -->
  <path d="M 633 223 C 613 168, 677 168, 657 223" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="645" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-size="14" fill="#64748b">a</text>

  <!-- Paso 3: s1 -> s2 con b (RESALTADO) -->
  <path d="M 671 237 Q 715 208 756 235" fill="none" stroke="#ea580c" stroke-width="3.2" marker-end="url(#arr-act)"/>
  <text x="704" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#ea580c">b</text>
  <circle cx="726" cy="208" r="10" fill="#ea580c"/>
  <text x="726" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#ffffff">3</text>

  <!-- s2 -> s1 con a (inactivo) -->
  <path d="M 759 263 Q 715 292 674 265" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="715" y="296" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-size="14" fill="#64748b">a</text>

  <!-- s2 -> s0 con b (inactivo) -->
  <path d="M 768 275 Q 645 375 532 276" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="645" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-size="14" fill="#64748b">b</text>

  <!-- Nodos s0, s1, s2 (s2 en verde por ser estado final alcanzado) -->
  <circle cx="515" cy="250" r="28" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="515" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">s0</text>

  <circle cx="645" cy="250" r="28" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="645" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">s1</text>

  <circle cx="785" cy="250" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="3.2"/>
  <circle cx="785" cy="250" r="22.5" fill="none" stroke="#16a34a" stroke-width="3.2"/>
  <text x="785" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#14532d">s2</text>

  <rect x="450" y="395" width="376" height="32" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="638" y="416" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#166534">✅ Palabra "bab" RECONOCIDA (Terminó en s2 ∈ F)</text>
</svg>
