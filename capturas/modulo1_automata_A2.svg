<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <rect width="880" height="460" rx="12" fill="#0f172a"/>
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#ef4444"/>
  <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="6" fill="#22c55e"/>
  <text x="440" y="23" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">Módulo 1 · Construcción y Gráfica del Autómata A2 (Sección 4.3 / Sección 7)</text>

  <!-- Consola Izquierda -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#e2e8f0">
    <text x="24" y="65" fill="#38bdf8" font-weight="bold">=== MÓDULO 1: CONSTRUCCIÓN DEL AUTÓMATA ===</text>
    <text x="24" y="90">1. Estados Q: <tspan fill="#4ade80">s0, s1, s2</tspan></text>
    <text x="24" y="112">2. Alfabeto Σ: <tspan fill="#4ade80">a, b</tspan></text>
    <text x="24" y="134">3. Función de transición δ:</text>
    <text x="40" y="154" fill="#94a3b8">δ(s0, 'a') = s1   |   δ(s0, 'b') = s0</text>
    <text x="40" y="174" fill="#94a3b8">δ(s1, 'a') = s1   |   δ(s1, 'b') = s2</text>
    <text x="40" y="194" fill="#94a3b8">δ(s2, 'a') = s1   |   δ(s2, 'b') = s0</text>
    <text x="24" y="216">4. Estado inicial q0: <tspan fill="#4ade80">s0</tspan></text>
    <text x="24" y="238">5. Estados finales F: <tspan fill="#4ade80">s2</tspan></text>

    <text x="24" y="270" fill="#facc15" font-weight="bold">1. Definición formal (5-tupla):</text>
    <text x="40" y="292" fill="#ffffff" font-weight="bold">M = ({s0, s1, s2}, {a, b}, δ, s0, {s2})</text>

    <text x="24" y="324" fill="#facc15" font-weight="bold">2. Tabla de transiciones del AFD:</text>
    <text x="40" y="346">+----------+------+------+</text>
    <text x="40" y="364">| Estado   |  a   |  b   |</text>
    <text x="40" y="382">+----------+------+------+</text>
    <text x="40" y="400">| →  s0    |  s1  |  s0  |</text>
    <text x="40" y="418">|    s1    |  s1  |  s2  |</text>
    <text x="40" y="436">| *  s2    |  s1  |  s0  |</text>
  </g>

  <!-- Tarjeta de Gráfica Derecha -->
  <rect x="420" y="55" width="436" height="380" rx="10" fill="#ffffff"/>
  <text x="638" y="85" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Gráfica Generada Automáticamente (Autómata A2)</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Flecha inicial -->
  <line x1="445" y1="240" x2="486" y2="240" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Bucle s0 con b -->
  <path d="M 503 213 C 483 160, 547 160, 527 213" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">b</text>

  <!-- s0 -> s1 con a -->
  <line x1="543" y1="240" x2="612" y2="240" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="578" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">a</text>

  <!-- Bucle s1 con a -->
  <path d="M 633 213 C 613 160, 677 160, 657 213" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="645" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">a</text>

  <!-- s1 -> s2 con b (curva superior) -->
  <path d="M 671 227 Q 715 198 756 225" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">b</text>

  <!-- s2 -> s1 con a (curva inferior) -->
  <path d="M 759 253 Q 715 282 674 255" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">a</text>

  <!-- s2 -> s0 con b (arco largo inferior) -->
  <path d="M 768 265 Q 645 365 532 266" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="645" y="335" text-anchor="middle" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e293b">b</text>

  <!-- Nodos s0, s1, s2 -->
  <circle cx="515" cy="240" r="28" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.4"/>
  <text x="515" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">s0</text>

  <circle cx="645" cy="240" r="28" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.4"/>
  <text x="645" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">s1</text>

  <circle cx="785" cy="240" r="28" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.4"/>
  <circle cx="785" cy="240" r="22.5" fill="none" stroke="#1e3a8a" stroke-width="2.4"/>
  <text x="785" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">s2</text>
</svg>
